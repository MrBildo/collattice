name: Install smoke

# Lightweight post-publish smoke: download the just-shipped linux-x64 release
# archive, extract it, launch the binary in the hosted-separately shape
# (Hosting:ServeSpa=false), curl /health (expect 200), curl /api/v1/boards
# (expect 401 — sensible non-error proving the API layer is reachable through
# the auth gate). Catches the most likely shipping regressions — broken bind,
# missing files, broken health, broken startup — before operators do.
#
# Linux-x64 only by design. Collabhost runs the multi-platform / QEMU shape
# (install-integration.yml); Collattice's posture is "smallest durable smoke
# that catches what an operator would hit first." Scope expansion is its own
# card.
#
# Triggers:
#   - workflow_run (Publish success): post-release validation against the
#     just-published archive. Chained off publish.yml — NOT release.published —
#     to avoid the parallel-fire race Collabhost hit on its v1.0.0 cut
#     (collabhost#211): publish.yml must finish uploading the archive before
#     this workflow can download it.
#   - workflow_dispatch: manual runs against an existing tag, useful for
#     re-running after a transient failure or validating the workflow itself.

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to smoke (e.g. v1.12.2). Required.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  # Resolve the release under test once, for both smoke jobs. Pre-releases
  # (vX.Y.Z-rc.1 and the like) are accepted on purpose: a release candidate is
  # exactly the artifact worth smoke-testing before the final cut. The pattern is
  # the same one publish.yml's tag gate uses, so any tag that could have been
  # published can be smoked.
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # For workflow_run: only proceed when publish.yml succeeded on a release
    # event. For workflow_dispatch: always proceed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      number: ${{ steps.resolve.outputs.number }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # workflow_run: head_branch carries the tag name when publish.yml
          # was triggered by a release event on a tag push.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_TAG:-}" ]]; then
            VERSION="${RELEASE_TAG}"
            SOURCE="workflow_run (publish.yml)"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION}"
            SOURCE="workflow_dispatch input"
          else
            echo "No release tag and no workflow_dispatch input provided." >&2
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Resolved version '${VERSION}' is not a vX.Y.Z or vX.Y.Z-<pre-release> tag." >&2
            exit 1
          fi

          echo "Resolved version: ${VERSION} (source: ${SOURCE})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # The binary reports its version without the leading v.
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Install smoke (linux-x64)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern 'collattice-linux-x64.tar.gz'
          ls -la

      - name: Extract archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install"
          tar -xzf "$RUNNER_TEMP/dl/collattice-linux-x64.tar.gz" \
            -C "$RUNNER_TEMP/install"
          ls -la "$RUNNER_TEMP/install"
          # Archives are FLAT (#237): the binary sits at the extract root, no
          # wrapping collattice-linux-x64/ directory. Assert the binary at the
          # root and pin the install dir to the extract root. (Before #282 this
          # step asserted a wrapping directory the flat-layout flip had removed,
          # which silently failed every release-time smoke run -- the exact
          # publish-time-only blind spot #282 closes.)
          test -x "$RUNNER_TEMP/install/Collabot.Collattice.Api"
          echo "INSTALL_DIR=$RUNNER_TEMP/install" >> "$GITHUB_ENV"

      - name: Binary reports the release under test
        env:
          EXPECTED: ${{ needs.resolve.outputs.number }}
        run: |
          set -euo pipefail
          reported="$("$INSTALL_DIR/Collabot.Collattice.Api" --version)"
          echo "Binary reports: ${reported}"
          test "${reported}" = "Collattice ${EXPECTED}" \
            || { echo "expected 'Collattice ${EXPECTED}'" >&2; exit 1; }

      - name: Launch binary (hosted-separately shape)
        env:
          # Hosted-separately shape: API headless, listens on loopback, db
          # under a temp dir we control. The smoke proves the binary starts
          # under operator-realistic configuration without an installer
          # having pre-written appsettings.json.
          Hosting__ServeSpa: 'false'
          Hosting__ListenAddress: '127.0.0.1'
          Hosting__ListenPort: '8080'
          ConnectionStrings__Board: 'Data Source=${{ runner.temp }}/smoke-data/collattice.db'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-data"
          cd "$INSTALL_DIR"
          # Launch in background, capture stdout+stderr, record PID for
          # teardown.
          ./Collabot.Collattice.Api > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          echo "Launched PID $(cat "$RUNNER_TEMP/api.pid")"

      - name: Wait for /health (expect 200)
        run: |
          set -euo pipefail
          # Poll up to 30s. Curl --fail makes any non-2xx exit non-zero.
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w '%{http_code}\n' \
                http://127.0.0.1:8080/health 2>/dev/null \
                | tee /tmp/health_code | grep -q '^200$'; then
              echo "Health check passed on attempt $i."
              exit 0
            fi
            sleep 1
          done
          echo "Health check never returned 200." >&2
          echo "--- last 200 lines of API log ---" >&2
          tail -n 200 "$RUNNER_TEMP/api.log" >&2 || true
          exit 1

      - name: Probe /api/v1/boards (expect 401 — API layer reachable through auth gate)
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/boards)
          echo "GET /api/v1/boards -> ${code}"
          # 401 is the expected auth-gate response with no X-User-Key header.
          # Any other code (500 = startup contract broken, 404 = routing
          # broken, 200 = auth gate not wired) is a regression.
          test "${code}" = "401"

      - name: Teardown
        if: always()
        run: |
          set -eu
          if [[ -f "$RUNNER_TEMP/api.pid" ]]; then
            pid=$(cat "$RUNNER_TEMP/api.pid")
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              # Give it a moment to shut down cleanly, then force.
              for i in $(seq 1 5); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi
          # Always dump the last bit of the log to the run output so a
          # post-mortem of a failed smoke has something to look at.
          if [[ -f "$RUNNER_TEMP/api.log" ]]; then
            echo "--- last 50 lines of API log ---"
            tail -n 50 "$RUNNER_TEMP/api.log" || true
          fi

  # Prove the load-bearing safety property of the fresh-install naming change
  # end-to-end: an operator whose install is already present under the earlier name,
  # running the current installer, keeps their database exactly where it is and
  # untouched -- the installer must NOT create a fresh Collattice install beside it
  # and orphan real data. This is the post-publish complement to the PR-CI
  # installer-detection job (which proves location detection hermetically via
  # --dry-run); here the REAL install.sh downloads and installs the published
  # release over a seeded existing install, exercising the full download + merge
  # path, and we assert the old location was kept, no new Collattice directory was
  # created, and the database bytes are byte-identical afterward.
  #
  # The installer comes from the checkout (the default branch for a workflow_run
  # trigger), which is the same install.sh operators pipe from the main branch. It
  # is pinned to the release under test with COLLATTICE_VERSION rather than left
  # to find "latest": GitHub's latest-release endpoint never returns a
  # pre-release, and it can point at a different release than the one that just
  # published. The installed binary's own --version is then checked against the
  # tag, so an installer that ignored the pin fails here instead of passing on
  # some other release.
  upgrade-in-place:
    name: Upgrade-in-place over existing install (linux-x64)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Seed an existing old-path install
        run: |
          set -euo pipefail
          fakehome="$RUNNER_TEMP/fakehome"
          old="$fakehome/.collaboard"
          mkdir -p "$old/data"
          # Baseline sidecar = what shipped last time (the repo's shipped defaults).
          cp backend/Collabot.Collattice.Api/appsettings.json "$old/appsettings.shipped.json"
          # Operator's on-disk config = shipped defaults plus an operator-pinned
          # ConnectionStrings:Board at the OLD path (what an existing install carries);
          # the merge must preserve it.
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); d['ConnectionStrings']={'Board': f'Data Source={sys.argv[2]}/data/collaboard.db'}; json.dump(d, open(sys.argv[3],'w'), indent=2)" \
            "$old/appsettings.shipped.json" "$old" "$old/appsettings.json"
          # Sentinel database bytes -- must be byte-identical after the installer runs.
          head -c 4096 /dev/urandom > "$old/data/collaboard.db"
          sha256sum "$old/data/collaboard.db" | awk '{ print $1 }' > "$RUNNER_TEMP/db.sha.before"
          echo "FAKEHOME=$fakehome" >> "$GITHUB_ENV"

      - name: Run the real installer over the existing install
        env:
          COLLATTICE_VERSION: ${{ needs.resolve.outputs.version }}
        run: HOME="$FAKEHOME" bash install.sh

      - name: Assert existing install kept in place, data untouched
        env:
          EXPECTED: ${{ needs.resolve.outputs.number }}
        run: |
          set -euo pipefail
          old="$FAKEHOME/.collaboard"
          new="$FAKEHOME/.collattice"
          test -d "$old" || { echo "old install dir vanished" >&2; exit 1; }
          if [ -e "$new" ]; then
            echo "installer created a fresh Collattice dir beside the existing install" >&2
            exit 1
          fi
          after="$(sha256sum "$old/data/collaboard.db" | awk '{ print $1 }')"
          before="$(cat "$RUNNER_TEMP/db.sha.before")"
          test "$after" = "$before" || { echo "database bytes changed (before=$before after=$after)" >&2; exit 1; }
          grep -q 'data/collaboard.db' "$old/appsettings.json" || { echo "operator DB path not preserved by merge" >&2; exit 1; }
          reported="$("$old/Collabot.Collattice.Api" --version)"
          test "${reported}" = "Collattice ${EXPECTED}" \
            || { echo "installed '${reported}', expected 'Collattice ${EXPECTED}' -- the installer did not install the release under test" >&2; exit 1; }
          echo "upgrade-in-place: existing install kept, data byte-identical, connection string preserved, ${reported} installed"
