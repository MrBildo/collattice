name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  extract-version:
    name: Extract version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Parse tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # SemVer 2.0 §9 pre-release identifier: dot-separated alphanumerics
          # (and hyphens). Examples: v1.10.0, v1.10.1-rc1, v2.0.0-beta.3,
          # v2.0.0-alpha.1.beta. Build metadata (+...) is intentionally NOT
          # accepted -- VERSION becomes a path segment in archive filenames and
          # a '+' there is friction across tools (URL-encoding, shell quoting,
          # the GitHub asset name). Rejecting it before any build leg runs is
          # the whole point of this gate. If we ever need build-metadata tags,
          # revisit then. Mirrors Collabhost publish.yml's extract-version job.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag '${TAG}' does not match vX.Y.Z or vX.Y.Z-<pre-release> (per SemVer 2.0 §9)." >&2
            echo "Build metadata (+meta) and non-SemVer tags are rejected." >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build ${{ matrix.rid }}
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: collattice-win-x64
            bin: Collabot.Collattice.Api.exe
            ext: zip
          - rid: osx-arm64
            artifact: collattice-osx-arm64
            bin: Collabot.Collattice.Api
            ext: tar.gz
          - rid: osx-x64
            artifact: collattice-osx-x64
            bin: Collabot.Collattice.Api
            ext: tar.gz
          - rid: linux-x64
            artifact: collattice-linux-x64
            bin: Collabot.Collattice.Api
            ext: tar.gz
          - rid: linux-arm64
            artifact: collattice-linux-arm64
            bin: Collabot.Collattice.Api
            ext: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # CI validation
      - name: Restore backend
        run: dotnet restore backend/Collabot.Collattice.slnx

      - name: Build backend
        run: dotnet build backend/Collabot.Collattice.slnx --no-restore

      - name: Test backend
        run: dotnet test backend/ --no-build --verbosity normal

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check frontend
        run: npx tsc -b
        working-directory: frontend

      # Build the frontend for the release archive, then copy it to wwwroot so
      # dotnet publish picks it up. This is a plain build with NO sourcemaps --
      # deliberately, so a sourcemap can never reach a release archive by
      # construction.
      #
      # It is a SEPARATE build from the one PR CI checks. The PR contract job
      # (ci.yml) builds with `--sourcemap hidden`, derives the THIRD-PARTY-NOTICES
      # inventory from those sourcemaps, moves them out, and ships that build. So
      # for a release the guarantee is "same recipe," not "same bytes": CI verifies
      # the inventory against a hidden-sourcemap build, and this plain build is
      # trusted to bundle the same set of source modules.
      #
      # That trust rests on a measured property, not a per-build comparison.
      # `--sourcemap hidden` leaves the emitted .js/.css byte-identical to a plain
      # build -- its whole effect is the extra .map sidecars -- verified over
      # alternating builds of both modes. A byte-for-byte comparison of the two
      # builds is deliberately NOT done: repeated builds of an unchanged tree draw
      # one of two variants of a shared chunk, so that comparison fails on healthy
      # trees, and it is strictly stronger than the "same source modules"
      # obligation it stood in for. What IS enforced on this path is the archive
      # contract: verify-archive.sh rejects both sourcemap files and any lingering
      # sourceMappingURL reference in the packaged archive.
      - name: Build frontend
        run: npx vite build
        working-directory: frontend

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p backend/Collabot.Collattice.Api/wwwroot
          cp -r frontend/dist/* backend/Collabot.Collattice.Api/wwwroot/

      # Publish self-contained, non-single-file (directory layout). Self-contained
      # keeps the no-runtime-needed property; dropping single-file removes the
      # runtime native-lib self-extraction step entirely, which is the precondition
      # that fails under hardened/read-only-cwd hosting (Collattice #231).
      #
      # The bundled runtime version is not floating: it is pinned by
      # RuntimeFrameworkVersion in Collabot.Collattice.Api.csproj (bumped via
      # scripts/bump-runtime.sh), so a tag rebuilds to the same runtime it shipped.
      - name: Publish
        env:
          VER: ${{ needs.extract-version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish backend/Collabot.Collattice.Api/Collabot.Collattice.Api.csproj \
            -c Release \
            -r "${RID}" \
            --self-contained \
            /p:Version="${VER}" \
            -o "publish/${{ matrix.artifact }}"

      # Explicit archive contract: an exclusion list (strip known-bad patterns)
      # backed by a top-level allow-list (fail on anything unrecognized).
      #
      # Collattice ships a directory-layout self-contained publish (~380 files:
      # the apphost binary plus the entire .NET runtime as loose DLLs and native
      # libs). A per-FILE allow-list -- the shape Collabhost's single-file publish
      # uses -- is the wrong tool here: enumerating 350+ runtime DLLs is
      # unmaintainable and self-defeating. So the baseline contract is "everything
      # dotnet publish emits, MINUS a small, named set of dev/debug/SDK-scratch
      # artifacts that must never reach an operator." The exclusion list IS that
      # contract boundary; the verify step fails the leg if any excluded pattern
      # survives staging or any required item is absent.
      #
      # Exclusion alone has one soft spot: a GENUINELY NOVEL SDK-added file (e.g.
      # a hypothetical future *.staticwebassets.runtime.json) matches none of the
      # excluded patterns, so it survives staging and ships. An exclusion list
      # passes unknown files by default; an allow-list would reject them. The
      # verify step closes this with a top-level allow-list keyed on the one
      # observation that makes a per-file list tractable: the runtime DLL/native
      # set drifts only at the TOP level, and that top level is a small set of
      # stable CLASSES (managed/native libraries) plus a short named set of
      # non-library artifacts.
      #
      # Staging also bundles THIRD-PARTY-NOTICES.md, and the verify step requires
      # it. That file is a shipping obligation, not documentation: the archive
      # redistributes Apache-2.0 and BSD-licensed components whose terms ask that
      # recipients of the binaries also receive the license, and attribution that
      # stays in the source repository never reaches someone who downloads a
      # release. Its inventory is re-derived and diffed against the build in PR
      # CI, so it cannot silently fall behind the dependencies it describes.
      #
      # The stage + verify logic both live in scripts/ (stage-archive.sh,
      # verify-archive.sh) so that the PR-CI contract check (ci.yml) runs the
      # EXACT same logic -- they cannot drift. The blind spot #282 closed: this
      # workflow runs only on `release: published`, so #280 (win-x64 web.config)
      # and #281 (gh upload repo-context) both shipped green-in-PR and failed
      # only at release. The shared scripts are PR-exercisable.
      - name: Stage archive
        run: |
          bash scripts/stage-archive.sh \
            "publish/${{ matrix.artifact }}" \
            "archive-stage/${{ matrix.artifact }}" \
            "${{ matrix.bin }}" \
            "${{ matrix.rid }}"

      # Platform-appropriate, FLAT-layout archive. The archive root IS the stage
      # directory's contents -- no wrapping "collattice-<rid>/" directory. The
      # installer scripts (install.sh, install.ps1) and INSTALL.md assume the
      # binary and appsettings.json sit at the extract root. tar -C STAGE . and
      # Compress-Archive "$STAGE/*" both flatten; the verify step locks it.
      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $stage = "archive-stage/${{ matrix.artifact }}"
          Compress-Archive -Path "$stage/*" `
                           -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          set -euo pipefail
          STAGE="archive-stage/${{ matrix.artifact }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "${STAGE}" .

      # Contract verification via the shared scripts/verify-archive.sh — the
      # SAME script the PR-CI contract check (ci.yml) runs, so the contract
      # cannot drift between PR and release. Extract the archive into a temp dir,
      # then hand it to the shared verifier. Fails the leg hard on any violation.
      - name: Verify archive contents
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail

          ARCHIVE="${{ matrix.artifact }}.${EXT}"
          VERIFY_DIR="verify-${{ matrix.rid }}"

          rm -rf "${VERIFY_DIR}"
          mkdir -p "${VERIFY_DIR}"

          case "${ARCHIVE}" in
            *.zip)    unzip -q "${ARCHIVE}" -d "${VERIFY_DIR}" ;;
            *.tar.gz) tar -xzf "${ARCHIVE}" -C "${VERIFY_DIR}" ;;
          esac

          bash scripts/verify-archive.sh \
            "${VERIFY_DIR}" \
            "${{ matrix.bin }}" \
            "Collabot.Collattice.Api"

      # Per-archive SHA-256 sidecar. Portable `sha256sum -c`-compatible format
      # (one line: "<hash>  <archive>"). Runners are ubuntu-latest, so sha256sum
      # is always present; the shasum fallback is defensive in case a future leg
      # moves to a macOS/Windows runner.
      - name: Checksum
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          ARCHIVE="${{ matrix.artifact }}.${EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          cat "${ARCHIVE}.sha256"

      # Upload archive + per-archive checksum to the GitHub Release that
      # triggered this workflow. --clobber makes matrix re-runs idempotent.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "${{ matrix.artifact }}.${EXT}" \
            "${{ matrix.artifact }}.${EXT}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber

      # Per-leg checksum artifact for the aggregation job.
      - name: Upload per-leg checksum artifact
        uses: actions/upload-artifact@v5
        with:
          name: checksum-${{ matrix.rid }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}.sha256
          retention-days: 7

  publish-checksums:
    name: Aggregate checksums.txt
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download per-leg checksums
        uses: actions/download-artifact@v5
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums-in

      - name: Aggregate
        run: |
          set -euo pipefail

          # Normalize to text-mode format: strip any leading '*' from the
          # filename column. sha256sum on Git-Bash (Windows runners) defaults to
          # binary mode and emits "<hash>  *<filename>", while Linux/macOS emit
          # "<hash>  <filename>". All current legs run on ubuntu-latest so no '*'
          # is expected, but normalizing keeps checksums.txt uniform if a leg
          # ever moves to a Windows runner -- one format for human operators and
          # for `sha256sum -c`.
          cat checksums-in/*.sha256 | sed 's/  \*/  /' | sort -k2 > checksums.txt
          echo "Aggregated checksums.txt:"
          cat checksums.txt

      - name: Upload aggregated checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
