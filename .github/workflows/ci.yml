name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/*']

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/Collabot.Collattice.slnx
      # Known security advisories against the backend's NuGet packages, direct and
      # transitive. Report-only by design: findings become a warning annotation and
      # a table in the job summary, and the step never fails the build, because the
      # severity threshold that should block a merge is still an open operator
      # decision (see the script header). It sits right after restore so it runs,
      # and reports, even when a later step fails.
      - name: Dependency advisories (report only)
        run: bash scripts/report-dependency-advisories.sh dotnet backend/Collabot.Collattice.slnx
      - name: Format
        # --severity error: the gate enforces exactly the editorconfig's :error
        # rules (the errors-or-quiet model the analyzer adoption is built on).
        # Default severity (warn) would also fail on the deferred warning-level
        # nudges, which belong to the separate recurring suggestion-resolution
        # gate, not this gate (#208).
        run: dotnet format backend/Collabot.Collattice.slnx --verify-no-changes --no-restore --severity error
      - name: Build
        run: dotnet build backend/Collabot.Collattice.slnx --no-restore --no-incremental
      - name: Test
        run: dotnet test backend/ --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      # Known security advisories against the production dependencies (the ones
      # that end up in the shipped bundle; dev tooling is excluded). Report-only,
      # same policy and reasoning as the backend step.
      - name: Dependency advisories (report only)
        run: bash scripts/report-dependency-advisories.sh npm frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend
      - name: Type check
        run: npx tsc -b
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend

  # Exercise the publish-archive contract in PR CI. publish.yml runs only on
  # `release: published`, so its stage/verify/upload logic had no PR-runnable
  # path -- #280 (win-x64 web.config drift) and #281 (gh upload repo-context)
  # both shipped through green PR CI and failed only at release. This job builds
  # ONE representative archive and runs the SAME scripts/{stage,verify}-archive.sh
  # that publish.yml runs (single source of truth -- they cannot drift), plus a
  # lint covering the #281 gh-context class. (#282)
  #
  # win-x64 specifically: it is the only RID that emits web.config +
  # aspnetcorev2_inprocess.dll (the Web SDK IIS/in-process hosting payload) --
  # the exact artifact #280 bit on. Cross-RID publish from ubuntu-latest is fully
  # supported (the SDK pulls the win-x64 runtime pack). Building one RID, not all
  # five, is a deliberate cost/coverage tradeoff: win-x64 is both the platform
  # that bit us and the richest contract surface; the Unix RIDs share the same
  # contract shape, which the shared script enforces against this archive.
  publish-contract:
    name: Publish archive contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RID: win-x64
      ARTIFACT: collattice-win-x64
      BIN: Collabot.Collattice.Api.exe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # gh-context lint (#281 class): assert every `gh release upload` in
      # publish.yml carries --repo. The #281 failure was a checkout-less job
      # relying on implicit git context (`fatal: not a git repository`); --repo
      # presence is the invariant that prevents it. A PR-runnable cover for a
      # class that otherwise only surfaces when the upload steps actually run.
      - name: Lint gh release upload --repo presence
        run: bash scripts/lint-gh-upload-repo.sh .github/workflows/publish.yml

      # Build frontend and copy to wwwroot so dotnet publish picks it up --
      # mirrors the publish.yml leg so the staged archive matches what ships.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ONE build, with sourcemaps written as sidecar files. `hidden` emits the
      # .map files without appending a sourceMappingURL trailer to the code, so
      # the emitted JavaScript is exactly what a plain `vite build` produces --
      # measured over alternating builds of both modes rather than assumed:
      # whenever both drew the same chunk variant (below), the .js/.css came
      # out byte-identical between the two, filenames included, and the flag's
      # entire effect was the extra .map files beside them. That is what lets
      # publish.yml keep building without sourcemaps while the inventory
      # checked here still describes the bundle a release ships.
      #
      # This used to be two builds -- one to ship, one with sourcemaps to read --
      # asserted byte-identical to each other. They are not required to be.
      # Repeated builds of an unchanged tree draw one of two variants of a single
      # shared chunk, so two independent builds disagree often enough that the
      # assertion went red on healthy pull requests. Both variants bundle an
      # identical set of source modules, which is the only thing the notices file
      # claims: the comparison was strictly stronger than the obligation, and a
      # gate that fails on differences its own claim does not care about teaches
      # people to re-run until it passes. Building once makes the audited bundle
      # the shipped bundle by construction, so there is nothing left to compare.
      - name: Build frontend
        run: npx vite build --sourcemap hidden
        working-directory: frontend

      # Move the sourcemaps out of the build output before anything reads it, so
      # every step below inherits a tree with none in it. The target sits outside
      # frontend/ deliberately: Tailwind's content scan is rooted at the Vite root
      # and skips only what git ignores, so an unignored directory inside it would
      # become an input to the next build. The script asserts both directions --
      # sourcemaps were found (an empty set would make the inventory below
      # describe nothing while looking clean) and none were left behind.
      - name: Set the bundle sourcemaps aside
        run: bash scripts/extract-bundle-sourcemaps.sh frontend/dist notices-sourcemaps

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p backend/Collabot.Collattice.Api/wwwroot
          cp -r frontend/dist/* backend/Collabot.Collattice.Api/wwwroot/

      - name: Publish (win-x64, self-contained)
        run: |
          set -euo pipefail
          dotnet publish backend/Collabot.Collattice.Api/Collabot.Collattice.Api.csproj \
            -c Release \
            -r "${RID}" \
            --self-contained \
            -o "publish/${ARTIFACT}"

      # Check the bundled .NET runtime against the current servicing release. A
      # self-contained archive carries the entire runtime inside it, so when a
      # runtime security patch ships an operator gets whatever we packaged, not a
      # fix from their own machine -- we own that patch window for them. Nothing
      # else in the pipeline looks at the runtime for currency: the dependency
      # scanners read the packages the project references, not the runtime pack the
      # publish bundles. The version is read from the same deps.json the notices
      # check uses (ground truth about what ships), compared to Microsoft's
      # published latest-runtime, and the step fails if we would ship one that is
      # behind. It runs here on a real representative publish, so a green PR proves
      # the whole check -- fetch, parse, compare -- rather than deferring it to a
      # release the way a publish-only step would.
      #
      # The build pins the runtime (RuntimeFrameworkVersion in Collabot.Collattice.Api.csproj),
      # so a rebuild from a given source revision reproduces the same runtime and a
      # servicing update is a deliberate, reviewed change rather than one that lands
      # silently. This check reads what the publish ACTUALLY bundled (deps.json, not
      # the csproj declaration) and fails if the pin has fallen behind the current
      # servicing release -- the prompt to run scripts/bump-runtime.sh.
      - name: Check .NET runtime currency
        run: |
          bash scripts/check-runtime-currency.sh \
            "publish/${ARTIFACT}/Collabot.Collattice.Api.deps.json"

      # Re-derive the third-party component inventory from what this build
      # actually produced -- the publish dependency manifest for the server side,
      # and the bundle's own sourcemaps for the browser side -- and fail if it
      # disagrees with what THIRD-PARTY-NOTICES.md publishes. The sourcemaps are
      # the ones set aside above, off the same build whose JavaScript is now in
      # wwwroot and about to be packaged.
      #
      # Several bundled components (DiffPlex, the OpenTelemetry set, the MCP SDK,
      # SQLitePCLRaw, Polly, highlight.js among them) are licensed on the
      # condition that recipients of the redistributed binaries also receive the
      # license. That makes the notices file a shipping obligation rather than
      # documentation, and an obligation nothing checks is one that quietly
      # lapses: the defect this exists to prevent was a dependency being added
      # with nobody noticing its license.
      #
      # The same run also requires that every license the inventory names has its
      # text reproduced in the file, and fails on a license it has no mapping for
      # rather than passing it through. An inventory entry naming a license the
      # document never prints discharges nothing, and is otherwise silent.
      - name: Verify third-party notices
        run: |
          bash scripts/generate-third-party-notices.sh \
            --check THIRD-PARTY-NOTICES.md \
            "publish/${ARTIFACT}/Collabot.Collattice.Api.deps.json" \
            frontend \
            notices-sourcemaps

      - name: Stage archive
        run: |
          bash scripts/stage-archive.sh \
            "publish/${ARTIFACT}" \
            "archive-stage/${ARTIFACT}" \
            "${BIN}" \
            "${RID}"

      # Package + extract so the verify runs against a real round-tripped
      # archive, exactly as the release path does (catches any packaging-side
      # surprise, not just the staged tree).
      - name: Package (zip)
        shell: pwsh
        run: |
          $stage = "archive-stage/${env:ARTIFACT}"
          Compress-Archive -Path "$stage/*" `
                           -DestinationPath "${env:ARTIFACT}.zip"

      - name: Verify archive contents
        run: |
          set -euo pipefail
          VERIFY_DIR="verify-${RID}"
          rm -rf "${VERIFY_DIR}"
          mkdir -p "${VERIFY_DIR}"
          unzip -q "${ARTIFACT}.zip" -d "${VERIFY_DIR}"
          bash scripts/verify-archive.sh \
            "${VERIFY_DIR}" \
            "${BIN}" \
            "Collabot.Collattice.Api"

  # Fresh-vs-existing install-location detection is the safety-critical property of
  # the fresh-install naming change: a fresh install must use the current
  # (Collattice) location, while an install already present under the earlier name
  # must be detected and kept in place -- so a fresh install can never land beside
  # and orphan an operator's real database. The installers' --dry-run resolves the
  # target location and exits without downloading or touching the filesystem, so
  # these tests exercise the real detection code paths hermetically: no network, no
  # published release, and therefore runnable here in PR CI (unlike the post-publish
  # install-smoke, which proves the full upgrade-in-place flow against a real
  # release). Both installers are covered because the detection lives in each.
  installer-detection:
    name: Installer path detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: install.sh detection (bash)
        run: bash scripts/test-installer-detection.sh install.sh
      - name: install.ps1 detection (pwsh)
        shell: pwsh
        run: ./scripts/test-installer-detection.ps1 ./install.ps1
